<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Campaign</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
  <a href="index.html">&larr; Back to Explore</a>
  <button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
</div>

<h1>Create Campaign</h1>
<p>Note: only the wallet that deployed the contract (the admin) can create campaigns.</p>

<form class="admin-form" onsubmit="createCampaign(event)">
  <label>Campaign Name</label>
  <input type="text" placeholder="e.g. Flood Relief" required>

  <label>Description</label>
  <textarea placeholder="What is this campaign for?" required></textarea>

  <label>Goal (ETH)</label>
  <input type="number" placeholder="10" step="0.1" required>

  <label>Organizer Address</label>
  <input type="text" placeholder="0x..." required>

  <button type="submit">Create Campaign</button>
</form>

<!-- ethers.js library: lets our JS talk to the blockchain -->
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script src="web3.js"></script>
<script>
  async function createCampaign(event) {
    event.preventDefault();
    const form = event.target;
    const title = form[0].value;
    const description = form[1].value;
    const goal = form[2].value;
    const organizer = form[3].value;

    const success = await createCampaignOnChain(title, description, goal, organizer);
    if (success) {
      alert("Campaign created!");
      form.reset();
    }
  }

  function onWalletConnected() {}

  window.addEventListener("DOMContentLoaded", async () => {
    await initContract(false);
  });
</script>
</body>
</html>
