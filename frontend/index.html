<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CrowdChain</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div style="display: flex; justify-content: space-between; align-items: center;">
  <h1>CrowdChain</h1>
  <button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
</div>

<a href="admin.html"><button>Create Campaign</button></a>
<p>Transparent Crowdfunding Through Blockchain</p>

<div id="campaignList"><p>Connect your wallet to load campaigns.</p></div>

<!-- ethers.js library: lets our JS talk to the blockchain -->
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script src="web3.js"></script>
<script>
  async function renderCampaigns() {
    const list = document.getElementById("campaignList");
    const campaigns = await getCampaigns();

    if (campaigns.length === 0) {
      list.innerHTML = "<p>No campaigns yet.</p>";
      return;
    }

    list.innerHTML = "";
    campaigns.forEach(c => {
      list.innerHTML += `
        <div class="campaign">
          <h3>${c.name}</h3>
          <p>Goal: ${c.goal} ETH</p>
          <p>Raised: ${c.raised} ETH</p>
          <a href="campaign.html?id=${c.id}"><button>View Campaign</button></a>
        </div>
      `;
    });
  }

  // Called from web3.js after a successful wallet connection
  function onWalletConnected() {
    renderCampaigns();
  }

  // If the wallet was already connected on a previous visit, reconnect silently
  window.addEventListener("DOMContentLoaded", async () => {
    await initContract(false);
    if (contract) renderCampaigns();
  });
</script>
</body>
</html>
